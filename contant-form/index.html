<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Φόρμα Επικοινωνίας</title>
</head>
<body>
    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h1>Επικοινωνήστε με την ομάδα μας</h1>
                <hr class="title-line">
            </div>
            <input type="hidden" name="access_key" value="bf601493-1eeb-4ffd-b5d6-02b8aefc44d2">
            <input type="text" name="Όνομα" placeholder="Καταχωρίστε το ονοματεπώνυμό σας" class="contact-inputs" required>
            <input type="text" name="email" placeholder="Διεύθυνση email" class="contact-inputs" required>
            <textarea name="Μήνυμα" placeholder="Το μύνημά σας" class="contact-inputs"></textarea>
            <button type="submit">Αποστολή <img src="./assets/blackarrow.png" alt=""></button>
        </form>
        <div class="contact-right">
            <img src="./assets/igem.sexy.logo.png" alt="Logo">
        </div>
    </div>
</body>
</html>
